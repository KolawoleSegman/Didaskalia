name: Release to Play Store (signed AAB)

# Run this by hand: GitHub > Actions > "Release to Play Store" > Run workflow.
# It needs four secrets (see README, "Publish on Google Play"):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  workflow_dispatch:

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', toLower(github.repository_owner), github.event.repository.name) }}
      - run: npx cap sync android
      - name: Decode signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/didaskalia.jks"
      - name: Build signed bundle
        working-directory: android
        run: ./gradlew bundleRelease
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/didaskalia.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: didaskalia-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
